name: gymlink

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${GYMLINK_SQLSERVER_SA_PASSWORD:?Add GYMLINK_SQLSERVER_SA_PASSWORD to .env}
    ports:
      - "${GYMLINK_SQLSERVER_PORT:-14330}:1433"
    volumes:
      - gymlink-sqlserver-data:/var/opt/mssql
    networks:
      - gymlink-internal
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.1-management
    hostname: gymlink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${GYMLINK_RABBITMQ_USERNAME:?Add GYMLINK_RABBITMQ_USERNAME to .env}
      RABBITMQ_DEFAULT_PASS: ${GYMLINK_RABBITMQ_PASSWORD:?Add GYMLINK_RABBITMQ_PASSWORD to .env}
    ports:
      - "${GYMLINK_RABBITMQ_PORT:-5672}:5672"
      - "${GYMLINK_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - gymlink-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - gymlink-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/src/GymLink.Api/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GymLink: Server=sqlserver,1433;Database=230038;User Id=sa;Password=${GYMLINK_SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__MigrateOnStartup: "true"
      Jwt__Issuer: ${Jwt__Issuer:-GymLink}
      Jwt__Audience: ${Jwt__Audience:-GymLink.Clients}
      Jwt__SigningKey: ${Jwt__SigningKey:?Add Jwt__SigningKey to .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-30}
      PasswordReset__CodePepper: ${PasswordReset__CodePepper:?Add PasswordReset__CodePepper to .env}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${GYMLINK_RABBITMQ_USERNAME}
      RabbitMq__Password: ${GYMLINK_RABBITMQ_PASSWORD}
      RabbitMq__NotificationDeadLetterQueue: gymlink.notifications.dead-letter.v1
      RabbitMq__EmailDeadLetterQueue: gymlink.email.dead-letter.v1
      Stripe__Enabled: ${Stripe__Enabled:-true}
      Stripe__SuccessUrl: ${Stripe__SuccessUrl:-http://10.0.2.2:62287/payments/stripe/success}
      Stripe__CancelUrl: ${Stripe__CancelUrl:-http://10.0.2.2:62287/payments/stripe/cancel}
      ALLOW_FAKE_PAYMENTS: ${ALLOW_FAKE_PAYMENTS:-false}
      Seed__Enabled: ${GYMLINK_COMPOSE_SEED_ENABLED:-true}
      Seed__DefaultPassword: ${Seed__DefaultPassword:-Test123!}
      FileStorage__RootPath: /data/trainer-images
      FileStorage__GymRootPath: /data/gym-images
      FileStorage__ChatRootPath: /data/chat-images
    ports:
      - "${GYMLINK_API_PORT:-62287}:8080"
    volumes:
      - gymlink-trainer-images:/data/trainer-images
      - gymlink-gym-images:/data/gym-images
      - gymlink-chat-images:/data/chat-images
    networks:
      - gymlink-internal
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/src/GymLink.Worker/Dockerfile
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__GymLink: Server=sqlserver,1433;Database=230038;User Id=sa;Password=${GYMLINK_SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${GYMLINK_RABBITMQ_USERNAME}
      RabbitMq__Password: ${GYMLINK_RABBITMQ_PASSWORD}
      RabbitMq__NotificationDeadLetterQueue: gymlink.notifications.dead-letter.v1
      RabbitMq__EmailDeadLetterQueue: gymlink.email.dead-letter.v1
      Smtp__Host: ${Smtp__Host:-smtp.gmail.com}
      Smtp__Port: ${Smtp__Port:-465}
      Smtp__UseSsl: ${Smtp__UseSsl:-true}
      Smtp__Username: ${Smtp__Username:?Add the Gmail sender address to .env}
      Smtp__Password: ${Smtp__Password:?Add a Gmail App Password to .env}
      Smtp__SenderEmail: ${Smtp__SenderEmail:?Add the Gmail sender address to .env}
      Smtp__SenderName: ${Smtp__SenderName:-GymLink}
      PasswordReset__CodePepper: ${PasswordReset__CodePepper:?Add PasswordReset__CodePepper to .env}
      Stripe__Enabled: ${Stripe__Enabled:-true}
    networks:
      - gymlink-internal
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

networks:
  gymlink-internal:
    driver: bridge

volumes:
  gymlink-sqlserver-data:
  gymlink-rabbitmq-data:
  gymlink-trainer-images:
  gymlink-gym-images:
  gymlink-chat-images:
