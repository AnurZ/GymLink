services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "${GYMLINK_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${GYMLINK_MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - gymlink-mailpit-data:/data
    networks:
      - gymlink-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    environment:
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__SenderEmail: no-reply@gymlink.local
      Smtp__SenderName: GymLink
    depends_on:
      mailpit:
        condition: service_healthy

volumes:
  gymlink-mailpit-data:
